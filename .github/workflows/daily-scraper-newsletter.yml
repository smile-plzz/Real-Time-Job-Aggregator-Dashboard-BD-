# Save as .github/workflows/daily-scraper-newsletter.yml
name: Daily Scraper & Email Newsletter Cron

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC = 9:00 AM Bangladesh Standard Time
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  trigger-scraper-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Endpoint to Wake Up & Dispatch Digest
        run: |
          curl -X POST https://your-app.onrender.com/api/cron/daily-digest \
            -H "Authorization: Bearer \${ secrets.CRON_SECRET }" \
            -H "Content-Type: application/json"
